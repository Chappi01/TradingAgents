<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastro-Imperium</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="scene"></div>

<div id="topbar">
  <div id="gameTitle">🍽️ Gastro-Imperium</div>
  <div id="money">0 €</div>
  <div id="rate"><b>0 €</b> pro Sekunde</div>
  <div id="subline"><span id="satInfo"></span><span id="starsInfo"></span></div>
</div>

<div id="controls">
  <button class="ctl" id="btnBuyAmt" title="Kaufmenge umschalten">×1</button>
  <button class="ctl" id="btnSettings" title="Einstellungen">⚙️</button>
  <button class="ctl" id="btnHelp" title="Hilfe">?</button>
  <button class="ctl" id="btnPrestige" title="Neueröffnung">⭐</button>
</div>

<div id="eventBanner"></div>
<div id="panel">
  <div id="tabs">
    <button data-tab="venues" class="active">🏪 Betriebe</button>
    <button data-tab="upgrades">🔬 Upgrades</button>
    <button data-tab="boni">🏆 Boni</button>
  </div>
  <div id="panelInner"></div>
</div>
<div id="toasts"></div>
<div id="modalWrap"><div id="modal"></div></div>

<script src="three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/economy.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/scene.js"></script>
<script src="js/actors.js"></script>
<script src="js/buildings.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
