<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastro-Imperium</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="scene"></div>
<div id="vignette"></div>

<div id="topbar">
  <div id="gameTitle">🍽️ Gastro-Imperium</div>
  <div id="money">0 €</div>
  <div id="rate"><b>0 €</b> pro Sekunde</div>
  <div id="subline"><span id="rankInfo"></span><span id="satInfo"></span><span id="weatherInfo"></span><span id="starsInfo"></span></div>
</div>

<div id="speedbar">
  <button data-sp="p" title="Pause">⏸</button>
  <button data-sp="1" title="Normales Tempo">1×</button>
  <button data-sp="2" title="Doppeltes Tempo (ab Ruf-Rang 2)">2×</button>
  <button data-sp="4" title="Vierfaches Tempo (ab Ruf-Rang 4)">4×</button>
</div>

<div id="controls">
  <button class="ctl" id="btnBuyAmt" title="Kaufmenge umschalten">×1</button>
  <button class="ctl" id="btnSettings" title="Einstellungen">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>
  </button>
  <button class="ctl" id="btnHelp" title="Hilfe">?</button>
  <button class="ctl" id="btnPrestige" title="Neueröffnung">
    <svg viewBox="0 0 24 24" class="star"><path d="M12 3l2.7 5.6 6.2.8-4.6 4.3 1.2 6.1L12 16.9l-5.5 2.9 1.2-6.1L3.1 9.4l6.2-.8z"/></svg><span id="prestigeLbl"></span>
  </button>
</div>

<div id="eventBanner"></div>
<div id="panel">
  <div id="tabs">
    <button data-tab="venues" class="active"><svg viewBox="0 0 24 24"><path d="M4 9l1.4-5h13.2L20 9M4.5 9v11h15V9M9.5 20v-5.5h5V20M3 9h18"/></svg>Betriebe</button>
    <button data-tab="upgrades"><svg viewBox="0 0 24 24"><path d="M9.5 3h5M10.5 3v5.2L5 17.5A2 2 0 006.8 21h10.4a2 2 0 001.8-3.5L13.5 8.2V3M7.5 14.5h9"/></svg>Upgrades</button>
    <button data-tab="ziele"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8"/></svg>Ziele</button>
    <button data-tab="boni"><svg viewBox="0 0 24 24"><path d="M7.5 4h9v5a4.5 4.5 0 01-9 0zM7.5 5.5H4.5a2.8 2.8 0 002.8 3M16.5 5.5h3a2.8 2.8 0 01-2.8 3M12 13.5V17M8.5 20.5h7M10 20.5V19a2 2 0 014 0v1.5"/></svg>Boni</button>
  </div>
  <div id="panelInner"></div>
</div>
<div id="toasts"></div>
<div id="modalWrap"><div id="modal"></div></div>

<script src="three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/staff.js"></script>
<script src="js/economy.js"></script>
<script src="js/missions.js"></script>
<script src="js/weather.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/scene.js"></script>
<script src="js/actors.js"></script>
<script src="js/buildings.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
